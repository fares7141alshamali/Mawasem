databases:
  - name: mawasem-db
    plan: free

services:
  - type: web
    name: mawasem-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: mawasem-db
          property: connectionString
      # Fill these in with the deployed frontend URL once it exists
      # (e.g. https://mawasem.vercel.app), comma-separated if more than one.
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: FRONTEND_URL
        value: ""
